<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>⚡ VOCAB BATTLE 3.0</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#15132a;color:white}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#473783,#15132a 65%);min-height:100vh}main{max-width:650px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(30px,7vw,44px);margin:8px 0}h2{margin:4px 0 18px}.muted{color:#c5c0e2}.tag{display:inline-block;background:#7454d9;padding:7px 13px;border-radius:30px;font-weight:800;font-size:12px}.card{background:#272342;border:1px solid #5b537e;border-radius:19px;padding:19px;margin:15px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.buttons{display:flex;flex-wrap:wrap;gap:10px}.buttons button{flex:1}button,input,select{font:inherit}button{min-height:50px;border:0;border-radius:12px;padding:12px 15px;background:#b1ff6e;color:#1a1930;font-weight:850;cursor:pointer}button.alt{background:#504a7b;color:white}button:disabled{opacity:.5}input,select{width:100%;padding:14px;border:2px solid #7b6ba7;border-radius:12px;background:#19162f;color:white;margin:8px 0 15px}.answers{display:grid;gap:10px}.answers button{background:#4b416d;color:white;text-align:left}.answers button.picked{border:3px solid #b1ff6e}.big{font-size:40px;color:#b1ff6e;font-weight:900;letter-spacing:3px;text-align:center}.score{font-size:25px;font-weight:900;color:#b1ff6e}.player{padding:12px;background:#393358;border-radius:10px;margin:8px 0}.error{color:#ffaaaa}.good{color:#b1ff6e}.small{font-size:13px}.bar{height:10px;background:#4b416d;border-radius:10px;overflow:hidden}.fill{height:100%;background:#b1ff6e}#status{min-height:22px}footer{text-align:center;color:#b4aacd;font-size:12px;margin-top:25px}</style></head><body><main><span class="tag">UNIT 2 · STATION 1 + 2</span><h1>⚡ VOCAB BATTLE 3.0</h1><p class="muted">3 Battles · je 30 Fragen · Schiedsrichter · Solo-Training</p><div id="status" aria-live="polite"></div><div id="app"></div><footer>Für Mehrspieler benötigt jedes Gerät Internet und einen eigenen Browser.</footer></main><script type="module">
const status=document.getElementById('status');
const showError=(message)=>{status.innerHTML='';const el=document.createElement('div');el.className='card error';el.style.whiteSpace='pre-wrap';el.textContent='Startfehler: '+message;status.appendChild(el);};

</script></body></html>
