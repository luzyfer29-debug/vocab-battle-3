<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VOCAB BATTLE 3.0 – Diagnose</title><style>body{font-family:system-ui,sans-serif;background:#201a42;color:white;padding:20px;line-height:1.6}h1{font-size:24px}.item{padding:12px;margin:8px 0;background:#352c61;border-radius:10px;overflow-wrap:anywhere}.ok{color:#91f5a9}.bad{color:#ffb4b4}.muted{color:#c7c0e3}</style></head><body><h1>🔎 VOCAB BATTLE 3.0 – Dateitest</h1><p>Diese Seite testet die Dateien direkt auf GitHub Pages. Bitte einen Screenshot der Ergebnisse schicken.</p><div id="results"></div><script type="module">
const files=['firebase-config.js','questions.js','math-questions.js','grammar-data.js','app.js'];
const out=document.querySelector('#results');
for(const file of files){const row=document.createElement('div');row.className='item';row.textContent='⏳ '+file+' wird geprüft …';out.append(row);try{const url='./'+file+'?diagnose='+Date.now();const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const source=await response.text();if(!source.trim())throw new Error('Datei ist leer');try{await import(url);row.innerHTML='<strong class="ok">✅ '+file+'</strong><div class="muted">'+source.length+' Zeichen – geladen</div>';}catch(err){row.innerHTML='<strong class="bad">❌ '+file+'</strong><div>'+String(err?.stack||err)+'</div><div class="muted">'+source.length+' Zeichen vorhanden</div>';}}catch(err){row.innerHTML='<strong class="bad">❌ '+file+'</strong><div>'+String(err)+'</div>';}}
</script></body></html>
